<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Peer Tutoring Request Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="container py-5">

        <h1>Request a tutoring session</h1>

        <form class="request-form" action="process-request.php" method="post">

            <!-- Course -->
            <div class="form-group mb-3">
                <label for="course">Course</label>
                <select id="course" name="course" class="form-control" required>
                    <option value="">Select a course</option>
                    <option value="IS 6465">IS 6465</option>
                    <option value="IS 6495">IS 6495</option>
                    <option value="IS 6570">IS 6570</option>
                </select>
            </div>

            <!-- Topic -->
            <div class="form-group mb-3">
                <label for="topic">What do you need help with?</label>
                <input id="topic" name="topic" class="form-control"
                       type="text" maxlength="120" required>
            </div>

            <!-- Preferred Date -->
            <div class="form-group mb-3">
                <label for="preferreddate">Preferred date</label>
                <input id="preferreddate" name="preferreddate"
                       class="form-control" type="date" required>
            </div>

            <!-- Preferred Time -->
            <div class="form-group mb-3">
                <label for="preferredtime">Preferred time</label>
                <select id="preferredtime" name="preferredtime"
                        class="form-control" required>
                    <option value="">Select a time</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                </select>
            </div>

            <button class="btn btn-danger" type="submit">
                Request session
            </button>

        </form>
    </main>
</body>

</html>
